[project]
name = "orderflow"
version = "0.1.0"
description = "Orders & stock core flow: idempotent order intake, stock that catches up after outages, and an order event feed."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx2>=2.16.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src", "scripts"]
